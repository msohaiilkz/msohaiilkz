name: Refresh animated profile cards

on:
  schedule:
    - cron: '17 2 * * *' # Daily, 02:17 UTC; scheduled runs can be delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'msohaiilkz/msohaiilkz'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG font-subsetting tools
        run: |
          python -m pip install --disable-pip-version-check 'fonttools[woff]>=4.55,<5'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-firacode

      - name: Fetch real public GitHub contributions and repo metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render animated SVG cards
        run: python scripts/render_cards.py

      - name: Validate generated SVG files
        run: python scripts/validate_cards.py

      - name: Commit only generated cards and contribution JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cards/ data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh contribution cards'
            git push
          else
            echo 'No generated changes to commit.'
          fi
